name: Experiment Comparative

on:
  pull_request:
    paths:
      - "packages/engine/**"
      - "experiments/**"
      - "data/**"
      - "scripts/run_comparative_experiment.py"
      - ".github/workflows/experiment-comparative.yml"
  push:
    branches:
      - develop
    paths:
      - "packages/engine/**"
      - "experiments/**"
      - "data/**"
      - "scripts/run_comparative_experiment.py"
      - ".github/workflows/experiment-comparative.yml"

jobs:
  exp-civ-001-comparative:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_comparative_experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp-civ-001-comparative-001
          path: results/exp-civ-001/comparative-001/*.json
          if-no-files-found: error
