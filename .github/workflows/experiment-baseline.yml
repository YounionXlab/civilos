name: Experiment Baseline

on:
  pull_request:
    paths:
      - "packages/engine/**"
      - "packages/research/**"
      - "experiments/**"
      - "data/**"
      - "scripts/run_experiment.py"
      - ".github/workflows/experiment-baseline.yml"
  push:
    branches:
      - develop
    paths:
      - "packages/engine/**"
      - "packages/research/**"
      - "experiments/**"
      - "data/**"
      - "scripts/run_experiment.py"
      - ".github/workflows/experiment-baseline.yml"

jobs:
  ares-alpha-baseline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_experiment.py --output artifacts/exp-civ-001-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp-civ-001-baseline
          path: artifacts/exp-civ-001-baseline.json
          if-no-files-found: error
